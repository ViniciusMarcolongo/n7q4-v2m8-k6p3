name: Sincronizar arquivos
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
  push:
    paths: ['tools/**', '.github/workflows/atualizar.yml']
permissions:
  contents: write
concurrency:
  group: cadastro
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar regras
        run: python -m unittest discover -s tools/updates -p 'test_*.py'
      - name: Preparar arquivos
        run: python tools/updates/refresh.py .
      - name: Salvar versões
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data latest.json status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar arquivos e registros de verificação'
            git push
          fi
