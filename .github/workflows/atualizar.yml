name: Atualizar cadastro de radares
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
  push:
    paths: ['tools/**', '.github/workflows/atualizar.yml']
permissions:
  contents: write
concurrency:
  group: cadastro
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar regras de atualização
        run: python -m unittest discover -s tools/updates -p 'test_*.py'
      - name: Consultar fontes oficiais e validar
        run: python tools/updates/refresh.py .
      - name: Publicar cadastro e auditoria
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data latest.json status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar cadastro e consulta das fontes oficiais'
            git push
          fi
